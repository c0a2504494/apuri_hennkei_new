<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f2ea" />
    <title>めざまし変形</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">alarm morph</p>
          <h1>めざまし変形</h1>
        </div>
        <button class="icon-button" id="editButton" aria-label="編集">✎</button>
      </header>

      <section class="hero panel movable" data-feature="hero" draggable="false">
        <div>
          <p class="eyebrow">now</p>
          <div class="clock" id="nowClock">00:00</div>
          <p id="nextAlarmText">アラームはまだありません</p>
        </div>
        <div class="sun" aria-hidden="true"></div>
      </section>

      <section class="panel movable" data-feature="quick" draggable="false">
        <div class="section-head">
          <h2>すぐ追加</h2>
          <span class="pill">かんたん</span>
        </div>
        <form id="alarmForm" class="form-grid">
          <label>
            <span>時刻</span>
            <input id="alarmTime" type="time" required />
          </label>
          <label>
            <span>名前</span>
            <input id="alarmLabel" maxlength="18" placeholder="朝のしたく" />
          </label>
          <label>
            <span>止め方</span>
            <select id="alarmMission">
              <option value="tap">大きなボタン</option>
              <option value="math">計算</option>
              <option value="type">合言葉</option>
            </select>
          </label>
          <button class="primary" type="submit">追加する</button>
        </form>
      </section>

      <section class="panel movable" data-feature="alarms" draggable="false">
        <div class="section-head">
          <h2>セット中</h2>
          <button class="text-button" id="clearDoneButton">鳴動記録を戻す</button>
        </div>
        <div id="alarmList" class="list"></div>
      </section>

      <section class="panel movable" data-feature="routine" draggable="false">
        <div class="section-head">
          <h2>朝のルーティン</h2>
          <span class="pill">ON/OFF可能</span>
        </div>
        <div id="routineList" class="check-list"></div>
      </section>

      <section class="panel movable" data-feature="transform" draggable="false">
        <div class="section-head">
          <h2>変形</h2>
          <span class="pill ad">広告枠</span>
        </div>
        <p class="muted">使う人に合わせて、機能の表示を切り替えます。将来はLLMがここを自動で組み替える想定です。</p>
        <div id="featureToggles" class="toggle-grid"></div>
      </section>
    </main>

    <dialog id="ringDialog">
      <form method="dialog" id="ringForm" class="dialog-card">
        <p class="eyebrow">wake up</p>
        <h2 id="ringTitle">時間です</h2>
        <p id="missionText">大きなボタンを押してください。</p>
        <input id="missionAnswer" autocomplete="off" />
        <button class="primary" value="stop">止める</button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
