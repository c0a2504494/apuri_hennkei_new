<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6ef" />
    <title>かけいぼ変形</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="appShell" data-theme="green">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="appEyebrow">budget morph</p>
          <h1 id="appTitle">かけいぼ変形</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="settingsButton" aria-label="設定">⚙</button>
        </div>
      </header>

      <section class="empty-state" id="emptyState">
        <div class="empty-art" aria-hidden="true"></div>
        <p class="eyebrow">blank canvas</p>
        <h2>まだ何もありません</h2>
        <p>右上の設定から、使いたい機能だけONにしてください。</p>
        <button class="primary" id="emptySettingsButton" type="button">機能を選ぶ</button>
      </section>

      <div class="feature-stack" id="featureStack">
        <section class="summary movable" data-feature="summary">
          <button class="help-button" data-help="summary" aria-label="予算サマリーの説明">?</button>
          <div>
            <span id="summaryBudgetLabel">今月の予算</span>
            <strong id="budgetTotal">¥0</strong>
          </div>
          <div>
            <span id="summarySpentLabel">使った</span>
            <strong id="budgetSpent">¥0</strong>
          </div>
          <div>
            <span id="summaryLeftLabel">残り</span>
            <strong id="budgetLeft">¥0</strong>
          </div>
        </section>

        <section class="panel movable" data-feature="input">
          <div class="section-head">
            <div class="title-row">
              <h2 data-feature-title="input">すぐ記録</h2>
              <button class="help-button" data-help="input" aria-label="すぐ記録の説明">?</button>
            </div>
            <span class="pill">3タップ目標</span>
          </div>
          <form id="budgetForm" class="form-grid">
            <label>
              <span>予算</span>
              <input id="monthlyBudget" type="number" min="0" step="100" inputmode="numeric" />
            </label>
            <label>
              <span>金額</span>
              <input id="expenseAmount" type="number" min="0" step="10" inputmode="numeric" required />
            </label>
            <label>
              <span>カテゴリ</span>
              <select id="expenseCategory">
                <option>食べもの</option>
                <option>交通</option>
                <option>学校・仕事</option>
                <option>遊び</option>
                <option>その他</option>
              </select>
            </label>
            <label class="wide">
              <span>メモ</span>
              <input id="expenseMemo" maxlength="32" placeholder="例: お昼ごはん" />
            </label>
            <button class="primary wide" type="submit">記録する</button>
          </form>
        </section>

        <section class="panel movable" data-feature="chart">
          <div class="section-head">
            <div class="title-row">
              <h2 data-feature-title="chart">カテゴリ</h2>
              <button class="help-button" data-help="chart" aria-label="カテゴリの説明">?</button>
            </div>
            <button class="text-button" id="resetButton">リセット</button>
          </div>
          <canvas id="chart" width="320" height="220" aria-label="カテゴリ別支出"></canvas>
        </section>

        <section class="panel movable" data-feature="records">
          <div class="section-head">
            <div class="title-row">
              <h2 data-feature-title="records">最近の記録</h2>
              <button class="help-button" data-help="records" aria-label="最近の記録の説明">?</button>
            </div>
            <span class="pill">ローカル保存</span>
          </div>
          <div id="expenseList" class="list"></div>
        </section>

        <section class="panel movable" data-feature="goals">
          <div class="section-head">
            <div class="title-row">
              <h2 data-feature-title="goals">ちいさな目標</h2>
              <button class="help-button" data-help="goals" aria-label="ちいさな目標の説明">?</button>
            </div>
            <span class="pill">ON/OFF可能</span>
          </div>
          <div id="goalList" class="check-list"></div>
        </section>
      </div>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="dialog-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">customize</p>
            <h2>表示する機能</h2>
          </div>
          <button class="icon-button" value="close" aria-label="閉じる">×</button>
        </div>
        <div class="ad-slot">広告スペース: 設定前の短い案内</div>
        <p class="muted">必要な機能だけONにできます。設定はこの端末のブラウザに保存されます。</p>
        <div id="featureToggles" class="toggle-grid"></div>
      </form>
    </dialog>

    <dialog id="helpDialog">
      <form method="dialog" class="dialog-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">guide</p>
            <h2 id="helpTitle">説明</h2>
          </div>
          <button class="icon-button" value="close" aria-label="閉じる">×</button>
        </div>
        <img id="helpImage" class="help-image" alt="" />
        <p id="helpText" class="muted"></p>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
